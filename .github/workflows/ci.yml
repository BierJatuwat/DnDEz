name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ลำดับ branch ของโปรเจกต์: feature/* → dev → main (ดู CONTRIBUTING.md)
  # ชื่อ branch มาจากคนเปิด PR — ส่งผ่าน env เท่านั้น ห้ามแทรก ${{ }} ลงในสคริปต์ตรง ๆ (script injection)
  branch-flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check merge direction
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            dev)
              [[ "$HEAD" == feature/* ]] || { echo "::error::PR เข้า dev ต้องมาจาก branch feature/* (PR นี้มาจาก $HEAD)"; exit 1; } ;;
            main)
              [[ "$HEAD" == dev ]] || { echo "::error::PR เข้า main ต้องมาจาก dev เท่านั้น (PR นี้มาจาก $HEAD)"; exit 1; } ;;
            *)
              echo "::error::PR ต้องเข้า dev (จาก feature/*) หรือ main (จาก dev) เท่านั้น — PR นี้เข้า $BASE"; exit 1 ;;
          esac
          echo "ok: $HEAD → $BASE"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ค่าตรงกับ docker-compose.yml และค่า default ในโค้ด/เทสต์ (ต่อ localhost ทั้งหมด) — ไม่ต้องตั้ง env เพิ่ม
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dndez
          POSTGRES_USER: dndez
          POSTGRES_PASSWORD: dndez
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dndez -d dndez"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # services ของ GitHub ส่ง command ให้ container ไม่ได้ แต่ image minio ต้องการ `server /data` จึงเปิดเองตรงนี้
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=dndez -e MINIO_ROOT_PASSWORD=dndez12345 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.10

      - name: Build
        run: dotnet build DnDEz.sln -c Release

      - name: Apply migrations
        run: dotnet ef database update --project src/DnDEz.Infrastructure

      - name: Test
        run: dotnet test DnDEz.sln -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
