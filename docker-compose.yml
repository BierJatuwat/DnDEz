services:
  postgres:
    # pgvector image — RawChunk ต้องใช้ extension vector (ดู PROJECT-CONTEXT §3)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dndez
      POSTGRES_USER: dndez
      POSTGRES_PASSWORD: dndez
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dndez -d dndez"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # object storage สำหรับไฟล์ดิบ (source document, map asset) — signed URL อายุสั้น
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dndez
      MINIO_ROOT_PASSWORD: dndez12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
